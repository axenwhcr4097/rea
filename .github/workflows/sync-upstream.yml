# Tự đồng bộ fork này với bản gốc (morluto/rea) mỗi ngày.
# Chạy tay: tab Actions -> "Đồng bộ với bản gốc" -> Run workflow.
# Lưu ý: nếu bản gốc sửa file trong .github/workflows, token của Actions không được phép đẩy thay đổi đó
# -> lần chạy báo lỗi; khi ấy bấm "Sync fork" trên trang repo (hoặc `gh repo sync`) một lần là xong.
name: Đồng bộ với bản gốc

on:
  schedule:
    - cron: '17 1 * * *'   # 08:17 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # để tắt các workflow CI/Release của bản gốc trên fork

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Gộp thay đổi mới từ bản gốc
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync "${{ github.repository }}" --branch main

      - name: Tắt workflow của bản gốc (chỉ giữ workflow này)
        # Fork chỉ để giữ bản sao: không chạy CI/Release của tác giả gốc (tốn phút, báo lỗi vì thiếu secret)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active") | select(.path != ".github/workflows/sync-upstream.yml") | .id' |
          while read -r id; do
            echo "tắt workflow $id"
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
          done